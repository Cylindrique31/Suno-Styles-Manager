[package]
name = "suno-styles"
version = "1.1.0"
edition = "2021"
description = "Gestionnaire local de styles Suno"

[dependencies]
eframe = "0.31"
rusqlite = { version = "0.33", features = ["bundled"] }
arboard = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
